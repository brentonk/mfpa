# Print profile.  Activate with:  quarto render --to typst --profile print
#
# Produces a printable PDF of the book via Typst (bundled with Quarto — no LaTeX
# needed), with exercise answers collected at the back.  The HTML website is
# unaffected: this profile is only merged in when explicitly selected, and the
# print logic in the _filters/ Lua is guarded to fire on non-HTML targets only.
# See print/README.md and print/build.sh.

book:
  output-file: mfpa-lecture-notes

# Heading for the answers section at the back (_filters/print-answers.lua).
exercise-answers-title: "TODO(BJK): title for the answers appendix"

format:
  typst:
    # The orange-book template overrides Quarto's `papersize` (back to a4) and
    # `fontsize` (back to its 10pt default), so both are re-forced — along with
    # the boxed theorem styling — by print/paper-override.typ, injected at the
    # top of the body via include-before-body. The values here are kept in sync
    # for anything that reads them earlier in template processing.
    papersize: us-letter
    include-before-body:
      - print/paper-override.typ
    margin:
      x: 1.15in
      y: 1in
    fontsize: 11pt
    # Print-resolution R figures (Quarto's default is 96 dpi, which looks soft
    # on paper). Only reaches figures when a chapter actually re-executes: the
    # freeze cache keeps each chapter's Typst figures until its source changes.
    # After changing this, clear them with `print/build.sh --refresh-figures`.
    fig-dpi: 300
    toc: true
    number-sections: true
    section-numbering: "1.1"
