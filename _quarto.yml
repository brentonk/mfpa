project:
  type: book

# Only re-execute R chunks when their own code changes (results cached in
# _freeze/). Keeps prose/CSS-only previews from re-running Dataverse downloads.
# Both _freeze/ and _book/ are gitignored: GitHub Actions renders the book from
# source on every push to main and deploys the result (see
# .github/workflows/build-deploy.yml).
execute:
  freeze: auto

# Render every figure on a transparent device background so plots inherit the
# page's paper colour instead of sitting on a white card. (theme_cowplot()
# already blanks the ggplot plot/panel backgrounds, so the device is the only
# thing that paints white.) Applies to all R chunks; override per-chunk with
# `#| dev.args: {bg: "white"}` if a solid backdrop is ever needed.
#
# Use the ragg device rather than the default cairo png: ragg resolves fonts
# through systemfonts, which is how _common.R registers Archivo (the cairo
# device only sees fontconfig's system fonts and silently falls back to sans).
knitr:
  opts_chunk:
    dev: ragg_png
    dev.args:
      bg: transparent

filters:
  - at: pre-ast
    path: _filters/concepts.lua
  # remark.lua must run pre-ast: `.remark` is a reserved Quarto proof-type
  # environment, so we have to claim the div before Quarto's crossref pass
  # rewrites it into a proof-style block.
  - at: pre-ast
    path: _filters/remark.lua
  # Drops #exr-… exercise blocks — but only for non-HTML (print) targets; a
  # no-op for the HTML website. Must run pre-ast, before Quarto's crossref pass
  # rewrites the exercise divs out of `#exr-…` identifiers. See
  # _filters/strip-exercises.lua.
  - at: pre-ast
    path: _filters/strip-exercises.lua
  # Print-only: rewrite TeX-math macros the Typst writer can't handle. No-op for
  # HTML. See _filters/print-math-compat.lua.
  - _filters/print-math-compat.lua
  # HTML-only: glue trailing punctuation to inline math so the browser can't
  # wrap between a KaTeX box and its period. See _filters/math-punct.lua.
  - _filters/math-punct.lua
  - _filters/answer.lua

book:
  title: "Mathematical Foundations of Political Analysis"
  author: "Brenton Kenkel"
  date: last-modified
  chapters:
    - index.qmd
    - set_theory.qmd
    - limits_and_continuity.qmd
    - derivatives.qmd
    - integrals.qmd
    - references.qmd
  license: "CC BY-NC-SA 4.0"
  sidebar:
    style: "docked"
  page-footer:
    center: |
      <p xmlns:cc="http://creativecommons.org/ns#" class="cc-footer">This work is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/?ref=chooser-v1" target="_blank" rel="license noopener noreferrer" style="display:inline-block;">CC BY-NC-SA 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/nc.svg?ref=chooser-v1" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1" alt=""></a></p>

bibliography: references.bib

format:
  html:
    # Light-only for now. mfpa-dark.scss is kept on disk for a later dark pass.
    theme:
      - cosmo
      - mfpa.scss
    title-block-banner: false
    # KaTeX instead of MathJax: faster client-side render, smaller payload.
    html-math-method: katex
    monofont: 'Iosevka Web'
    linestretch: 1.6
    cap-location: top
    # Custom after-body scripts: fold the right-hand TOC into the left sidebar,
    # wire up the concept-definition tooltips, and un-glue math-punctuation
    # spans that are too wide for their container (see _filters/math-punct.lua).
    include-after-body:
      - _includes/sidebar-toc.html
      - _includes/concept-tooltip.html
      - _includes/math-punct.html

  # pdf:
  #   documentclass: scrreprt
